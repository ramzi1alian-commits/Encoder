name: بناء تطبيق أندرويد

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: صلاحية تنفيذ لملف gradlew
        run: chmod +x ./gradlew

      - name: بناء نسخة Debug من الـ APK
        run: ./gradlew assembleDebug

      - name: رفع الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
