name: بناء تطبيق أندرويد

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: بناء نسخة Debug من الـ APK (للتجربة السريعة فقط)
        run: gradle assembleDebug

      - name: رفع نسخة الـ Debug كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: فك تشفير الـ keystore الخاص بيك
        if: ${{ env.RELEASE_STORE_FILE_BASE64 != '' }}
        run: echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > release.keystore

      - name: بناء نسخة Release موقّعة بمفتاحك
        if: ${{ env.RELEASE_STORE_FILE_BASE64 != '' }}
        env:
          RELEASE_STORE_FILE: release.keystore
        run: gradle assembleRelease

      - name: رفع نسخة الـ Release الموقّعة
        if: ${{ env.RELEASE_STORE_FILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: secure-keyboard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
